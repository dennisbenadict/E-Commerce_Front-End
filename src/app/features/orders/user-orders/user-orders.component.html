<div class="orders" *ngIf="orders.length; else noOrders">
  <h2>My Orders</h2>
  <div *ngFor="let o of orders" class="order-card">
    <div>
      <h3>Order #{{ o.id ?? o.Id }}</h3>
      <p>Total: ₹{{ o.totalAmount ?? o.TotalAmount }}</p>
      <p>Status: {{ o.status ?? o.Status }}</p>
      <p>Placed: {{ o.createdAt ?? o.CreatedAt }}</p>
    </div>
  </div>
</div>

<ng-template #noOrders>
  <p>You have no orders yet.</p>
</ng-template>
