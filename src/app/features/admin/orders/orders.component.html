<div class="admin-orders">
  <h1>All Orders</h1>

  <div *ngIf="loading" class="loading">Loading...</div>

  <table *ngIf="!loading && orders.length" class="orders-table">
    <thead>
      <tr>
        <th>Id</th>
        <th>User</th>
        <th>Total</th>
        <th>Status</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orders">
        <td>{{ o.id ?? o.Id }}</td>
        <td>{{ o.userId ?? o.UserId }}</td>
        <td>₹{{ o.totalAmount ?? o.TotalAmount }}</td>
        <td>{{ o.status ?? o.Status }}</td>
        <td>{{ o.createdAt ?? o.CreatedAt }}</td>
        <td>
          <button (click)="cancelOrder(o.id ?? o.Id)"
                  [disabled]="(o.status ?? o.Status)?.toLowerCase() === 'cancelled'">
            Cancel
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !orders.length" class="empty">No orders found.</div>
</div>
