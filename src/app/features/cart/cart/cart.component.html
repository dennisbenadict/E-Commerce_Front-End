<div class="cart-container" *ngIf="cartItems.length; else empty">
  <div class="cart-item" *ngFor="let item of cartItems">
    <img [src]="item.imageUrls && item.imageUrls.length ? item.imageUrls[0] : ''" alt="{{ item.productName }}">
    <div>
      <h3>{{ item.productName }}</h3>
      <p>₹{{ item.price }}</p>
      <p>Qty: {{ item.quantity }}</p>
      <button (click)="removeItem(item.productId)">Remove</button>
    </div>
  </div>

  <div class="cart-summary">
    <h2>Total: ₹{{ getTotal() }}</h2>
    <button (click)="goToAddress()">Proceed to Checkout</button>

  </div>
</div>

<ng-template #empty>
  <h2>Your cart is empty 🛒</h2>
</ng-template>
